<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123F73">
<title>Orbit &mdash; Status</title>
<link rel="stylesheet" href="vn.css">
$(if refresh-timeout)<meta http-equiv="refresh" content="$(refresh-timeout)">$(endif)
</head>
<body>
<div class="login-page"><div class="login-box centro">
  <div class="marca">
    <img src="logo.png" alt="Orbit Sao Caetano"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div class="anel" style="display:none">
      <div class="anel-nome">orb<span class="i">&#305;</span>t</div>
      <div class="anel-linha"></div>
      <div class="anel-sub">S&Atilde;O CAETANO</div>
    </div>
  </div>
  <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 21l3.5-4.4a4.5 4.5 0 0 0-7 0L12 21zm6.4-8.1a10 10 0 0 0-12.8 0l-1.9-2.4a13 13 0 0 1 16.6 0l-1.9 2.4zM12 3a17 17 0 0 1 10.9 3.9l-1.9 2.4a14 14 0 0 0-18 0L1.1 6.9A17 17 0 0 1 12 3z"/></svg></div>
  <h1>Voc&ecirc; est&aacute; conectado</h1>
  <p class="sub">Rede $(server-name)</p>
  <div class="dados">
    <div><small>Endere&ccedil;o IP</small><b>$(ip)</b></div>
    <div><small>Aparelho</small><b>$(mac)</b></div>
    <div><small>Tempo conectado</small><b>$(uptime)</b></div>
    <div><small>Tempo restante</small><b>$(session-time-left)</b></div>
    <div><small>Baixado</small><b>$(bytes-in-nice)</b></div>
    <div><small>Enviado</small><b>$(bytes-out-nice)</b></div>
  </div>
  <a class="btn btn-sair" href="$(link-logout)" style="text-decoration:none">Desconectar</a>
</div></div>
</body>
</html>
