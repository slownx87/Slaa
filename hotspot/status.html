<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050814">
<title>VN System &mdash; Status</title>
<link rel="stylesheet" href="vn.css">
$(if refresh-timeout)<meta http-equiv="refresh" content="$(refresh-timeout)">$(endif)
</head>
<body class="login-page">
<div class="login-box" style="text-align:center">
  <div class="vn-brand">
    <img class="brand-logo" src="logo.png" alt="VN System"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <div class="vn-wordmark"><b>VN</b><span>SYSTEM</span></div>
  </div>
  <div class="vn-ico"><svg viewBox="0 0 24 24"><path d="M12 21l3.5-4.4a4.5 4.5 0 0 0-7 0L12 21zm6.4-8.1a10 10 0 0 0-12.8 0l-1.9-2.4a13 13 0 0 1 16.6 0l-1.9 2.4zM12 3a17 17 0 0 1 10.9 3.9l-1.9 2.4a14 14 0 0 0-18 0L1.1 6.9A17 17 0 0 1 12 3z"/></svg></div>
  <h1>Voc&ecirc; est&aacute; conectado</h1>
  <p class="sub">Rede $(server-name)</p>
  <div class="detail-grid">
    <div class="detail-item"><small>Usu&aacute;rio</small><b>$(username)</b></div>
    <div class="detail-item"><small>Aparelho</small><b>$(mac)</b></div>
    <div class="detail-item"><small>Endere&ccedil;o IP</small><b>$(ip)</b></div>
    <div class="detail-item"><small>Tempo conectado</small><b>$(uptime)</b></div>
    <div class="detail-item"><small>Baixado</small><b>$(bytes-in-nice)</b></div>
    <div class="detail-item"><small>Enviado</small><b>$(bytes-out-nice)</b></div>
  </div>
  <a class="btn btn-danger btn-block" href="$(link-logout)" style="margin-top:14px">Desconectar</a>
</div>
</body>
</html>
