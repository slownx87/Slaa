<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123F73">
<title>Orbit &mdash; Conectado</title>
<link rel="stylesheet" href="vn.css">
</head>
<body>
<div class="login-page"><div class="login-box centro">
  <div class="marca">
    <img src="logo.png" alt="Orbit Sao Caetano"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div class="anel" style="display:none">
      <div class="anel-nome">orb<span class="i">&#305;</span>t</div>
      <div class="anel-linha"></div>
      <div class="anel-sub">S&Atilde;O CAETANO</div>
    </div>
  </div>
  <div class="ico ok"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
  <h1>Conex&atilde;o liberada</h1>
  <p class="sub">Voc&ecirc; j&aacute; est&aacute; navegando. Bom uso!</p>
  <div class="dados">
    <div><small>Endere&ccedil;o IP</small><b>$(ip)</b></div>
    <div><small>Aparelho</small><b>$(mac)</b></div>
  </div>
  <a class="btn btn-primary" href="$(link-redirect)" style="margin-top:18px;text-decoration:none">Continuar navegando</a>
  <a class="btn btn-ghost" href="$(link-status)" style="text-decoration:none">Ver status da conex&atilde;o</a>
</div></div>
<script type="text/javascript">
window.setTimeout(function(){ window.location.href = "$(link-redirect)"; }, 3000);
</script>
</body>
</html>
