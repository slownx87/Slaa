<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123F73">
<title>Orbit &mdash; Desconectado</title>
<link rel="stylesheet" href="vn.css">
</head>
<body>
<div class="login-page"><div class="login-box centro">
  <div class="marca">
    <img src="logo.png" alt="Orbit Sao Caetano"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div class="anel" style="display:none">
      <div class="anel-nome">orb<span class="i">&#305;</span>t</div>
      <div class="anel-linha"></div>
      <div class="anel-sub">S&Atilde;O CAETANO</div>
    </div>
  </div>
  <div class="ico"><svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.8 2.2-1.4 1.4A7 7 0 1 1 5 12a7 7 0 0 1 2.6-5.4L6.2 5.2a9 9 0 1 0 11.6 0z"/></svg></div>
  <h1>Voc&ecirc; foi desconectado</h1>
  <p class="sub">Sess&atilde;o encerrada com sucesso.</p>
  <div class="dados">
    <div><small>Tempo conectado</small><b>$(uptime)</b></div>
    <div><small>Consumo total</small><b>$(bytes-in-nice)</b></div>
  </div>
  <a class="btn btn-primary" href="$(link-login)" style="margin-top:18px;text-decoration:none">Conectar novamente</a>
</div></div>
</body>
</html>
