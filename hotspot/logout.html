<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050814">
<title>VN System &mdash; Desconectado</title>
<link rel="stylesheet" href="vn.css">
</head>
<body class="login-page">
<div class="login-box" style="text-align:center">
  <div class="vn-brand">
    <img class="brand-logo" src="logo.png" alt="VN System"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <div class="vn-wordmark"><b>VN</b><span>SYSTEM</span></div>
  </div>
  <div class="vn-ico"><svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.8 2.2-1.4 1.4A7 7 0 1 1 5 12a7 7 0 0 1 2.6-5.4L6.2 5.2a9 9 0 1 0 11.6 0z"/></svg></div>
  <h1>Voc&ecirc; foi desconectado</h1>
  <p class="sub">Sess&atilde;o encerrada com sucesso.</p>
  <div class="detail-grid">
    <div class="detail-item"><small>Tempo conectado</small><b>$(uptime)</b></div>
    <div class="detail-item"><small>Consumo total</small><b>$(bytes-in-nice)</b></div>
  </div>
  <a class="btn btn-primary btn-block" href="$(link-login)">Conectar novamente</a>
</div>
</body>
</html>
